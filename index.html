<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✦ 我们的100天 ✦</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Inter:wght@300;500;700&display=swap" rel="stylesheet" />
    <style>
        /* ---------- 全局 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', 'Ma Shan Zheng', sans-serif;
            background: #fcf6f0;
            background-image: radial-gradient(circle at 30% 40%, #fff3e6 0%, #fcf6f0 70%);
            padding: 20px;
            overflow: hidden;
        }

        /* ---------- 主卡片 ---------- */
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 52px 60px 56px;
            border-radius: 48px;
            box-shadow: 
                0 20px 60px rgba(180, 140, 120, 0.12),
                0 8px 24px rgba(0, 0, 0, 0.03),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            text-align: center;
            max-width: 640px;
            width: 100%;
            border: 1px solid rgba(255, 230, 215, 0.4);
            transition: transform 0.25s ease;
            position: relative;
            z-index: 10;
        }

        .container:hover {
            transform: translateY(-4px);
        }

        .dot-deco {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .dot-deco span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #f0e4dc;
        }
        .dot-deco span:nth-child(2) {
            width: 8px;
            height: 8px;
            background: #e8d0c4;
        }

        h1 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 20px;
            font-weight: 400;
            color: #b8a090;
            letter-spacing: 6px;
            margin-bottom: 16px;
        }

        .timer {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 8px;
            margin: 4px 0 2px;
        }

        #days {
            font-family: 'Inter', sans-serif;
            font-size: 116px;
            font-weight: 700;
            line-height: 1;
            color: #6b4e3a;
            letter-spacing: -4px;
            text-shadow: 0 4px 20px rgba(160, 120, 90, 0.08);
        }

        .label {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 30px;
            color: #b8a090;
            margin-left: 4px;
        }

        .sub-timer {
            font-family: 'Inter', monospace;
            font-size: 22px;
            font-weight: 300;
            color: #cbb8ac;
            letter-spacing: 6px;
            margin-top: 8px;
            border-top: 1px solid #f0e4dc;
            padding-top: 16px;
        }
        .sub-timer span {
            min-width: 32px;
            display: inline-block;
        }

        .quote {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 18px;
            color: #d4c0b4;
            margin: 28px 0 32px;
            letter-spacing: 2px;
            border-bottom: 1px solid #f0e4dc;
            padding-bottom: 28px;
            min-height: 50px;
            transition: opacity 0.6s ease;
        }

        .gallery {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 36px;
        }
        .gallery img {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #f0e4dc;
            box-shadow: 0 4px 16px rgba(160, 130, 110, 0.06);
            transition: all 0.3s ease;
        }
        .gallery img:hover {
            transform: scale(1.05);
            border-color: #e8c8b8;
            box-shadow: 0 8px 24px rgba(160, 130, 110, 0.10);
        }

        #loveBtn {
            background: #f5e0d8;
            border: none;
            padding: 16px 48px;
            border-radius: 60px;
            color: #7a5e4e;
            font-size: 17px;
            font-family: 'Ma Shan Zheng', cursive;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(180, 140, 120, 0.08);
        }
        #loveBtn:hover {
            background: #f0d6cc;
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(180, 140, 120, 0.12);
        }
        #loveBtn:active {
            transform: scale(0.96);
        }

        #surprise {
            margin-top: 28px;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 24px;
            color: #c28a7a;
            transition: all 0.4s ease;
            min-height: 50px;
            letter-spacing: 2px;
        }
        .hidden {
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
        }
        .show {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        .footer-tip {
            margin-top: 30px;
            font-size: 13px;
            color: #dccfc8;
            letter-spacing: 1px;
            font-weight: 300;
        }

        /* ---------- 爱心雨 ---------- */
        .heart-rain {
            position: fixed;
            top: -20px;
            pointer-events: none;
            z-index: 9999;
            font-size: 28px;
            animation: rainDown linear forwards;
        }
        @keyframes rainDown {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.6);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(1.2);
                opacity: 0;
            }
        }

        /* ---------- 100天庆祝大标题 ---------- */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            pointer-events: none;
            animation: celebFade 0.8s ease-out forwards;
        }
        .celebration-text {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 72px;
            color: #6b4e3a;
            text-shadow: 0 0 40px rgba(200, 150, 120, 0.3), 0 8px 30px rgba(0,0,0,0.05);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(6px);
            padding: 30px 60px;
            border-radius: 60px;
            border: 1px solid rgba(255, 230, 215, 0.6);
            box-shadow: 0 20px 60px rgba(180, 140, 120, 0.15);
            transform: scale(0.8);
            animation: celebPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            letter-spacing: 6px;
        }
        @keyframes celebPop {
            0% { transform: scale(0.5) rotate(-6deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        @keyframes celebFade {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .celebration.fade-out {
            animation: celebFadeOut 1.2s ease-in forwards;
        }
        @keyframes celebFadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; transform: scale(1.05); }
        }

        /* ---------- 情书卡片 ---------- */
        .letter-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99998;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* 默认不可点，显示后改为 auto */
            opacity: 0;
            transition: opacity 0.6s ease;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }
        .letter-overlay.show {
            pointer-events: auto;
            opacity: 1;
        }
        .letter-card {
            background: rgba(255, 248, 242, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 40px 48px 36px;
            max-width: 560px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 230, 215, 0.6);
            box-shadow: 0 30px 80px rgba(180, 140, 120, 0.25);
            transform: translateY(30px) scale(0.95);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: left;
            position: relative;
        }
        .letter-overlay.show .letter-card {
            transform: translateY(0) scale(1);
        }
        .letter-card h2 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 28px;
            color: #6b4e3a;
            text-align: center;
            border-bottom: 2px solid #f0e4dc;
            padding-bottom: 16px;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }
        .letter-content {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 20px;
            line-height: 1.8;
            color: #5a4032;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 28px;
            min-height: 100px;
        }
        .letter-close {
            display: block;
            margin: 0 auto;
            background: #f5e0d8;
            border: none;
            padding: 12px 36px;
            border-radius: 60px;
            color: #7a5e4e;
            font-size: 18px;
            font-family: 'Ma Shan Zheng', cursive;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 16px rgba(180, 140, 120, 0.08);
        }
        .letter-close:hover {
            background: #f0d6cc;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(180, 140, 120, 0.12);
        }
        .letter-close:active {
            transform: scale(0.96);
        }

        /* ---------- 音乐控制按钮 ---------- */
        .music-control {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 230, 215, 0.5);
            border-radius: 50%;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(180, 140, 120, 0.12);
            transition: all 0.25s ease;
            color: #7a5e4e;
            user-select: none;
        }
        .music-control:hover {
            transform: scale(1.08);
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 24px rgba(180, 140, 120, 0.18);
        }
        .music-control:active {
            transform: scale(0.92);
        }
        .music-control.playing {
            background: rgba(245, 224, 216, 0.8);
            border-color: #e8c8b8;
        }

        /* ---------- 自适应 ---------- */
        @media (max-width: 480px) {
            .container {
                padding: 32px 24px 36px;
            }
            #days {
                font-size: 80px;
            }
            .label {
                font-size: 24px;
            }
            .sub-timer {
                font-size: 18px;
                letter-spacing: 4px;
            }
            .gallery img {
                width: 60px;
                height: 60px;
            }
            .celebration-text {
                font-size: 36px;
                padding: 20px 30px;
            }
            .music-control {
                bottom: 20px;
                right: 20px;
                width: 48px;
                height: 48px;
                font-size: 22px;
            }
            .letter-card {
                padding: 28px 20px 28px;
            }
            .letter-content {
                font-size: 17px;
            }
            .letter-card h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="dot-deco">
            <span></span><span></span><span></span>
        </div>
        <h1 id="titleText">✦ 与你共度的第 ✦</h1>
        <div class="timer">
            <span id="days">0</span>
            <span class="label" id="dayLabel">天</span>
        </div>
        <div class="sub-timer">
            <span id="hours">00</span> &nbsp;:&nbsp;
            <span id="minutes">00</span> &nbsp;:&nbsp;
            <span id="seconds">00</span>
        </div>
        <p class="quote" id="quoteDisplay">“ 想把所有温柔都揉进这100天里 ”</p>
        <div class="gallery">
            <img src="photos\1.jpg?random=10" alt="photo1" />
            <img src="photos\3.jpg?random=20" alt="photo2" />
            <img src="photos\2.jpg?random=30" alt="photo3" />
        </div>
        <button id="loveBtn">💗 点击 接收心动</button>
        <div id="surprise" class="hidden">❤ 你是我最温柔的欢喜 ❤</div>
        <div class="footer-tip">— 2026 · 专属100天纪念 —</div>
    </div>

    <!-- ========== 背景音乐（全局） ========== -->
    <audio id="bgMusic" loop preload="auto">
        <source src="music\青花瓷 (DJ版)-周杰伦.mp3" type="audio/mpeg" />
    </audio>

    <!-- ========== 彩蛋独立音乐（庆祝专用） ========== -->
    <audio id="celebrationMusic" preload="auto">
        <source src="music\张超 - 我在贵州等你.mp3" type="audio/mpeg" />
    </audio>

    <!-- 音乐控制按钮 -->
    <div class="music-control" id="musicToggle" title="播放/暂停背景音乐">🎵</div>

    <script>
        // ============================================================
        //  ✦ 在这里修改你们的在一起日期 ✦
        //  格式：new Date(年, 月-1, 日)  例：2026年5月20日 → new Date(2026, 4, 20)
        // ============================================================
        const startDate = new Date(2026, 3, 20);   // 👈 改成你们的真实日期！

        // ============================================================
        //  ✦ 情书内容（支持换行，用 \n 或者直接写多行字符串） ✦
        // ============================================================
        const LOVE_LETTER = `
亲爱的 宝：

这 100 天，像一场温柔的梦。
从第一眼的心动，到现在的默契，
每一天都被你点亮。

谢谢你愿意陪我一起幼稚，
也谢谢你在我低落时给我拥抱。
你是我疲惫生活里的糖，
也是我向前走的全部勇气。

未来还有无数个 100 天，
我想和你一起慢慢走。

100 天快乐，我的女孩。

—— 永远爱你的 松
        `.trim();

        // ============================================================
        //  以下代码保持不变
        // ============================================================
        const CELEBRATION_KEY = 'hundredDayCelebrated';

        const quotes = [
            '“ 遇见你，是我所有美好故事的开始 ”',
            '“ 宝贝，我想你啦”',
            '“ 锤死你！ ”',
            '“ 啪！我没有睡着！ ”',
            '“ 天菩萨 ！ ”',
            '“ 你今天没有说想我！ ”',
            '“ 坦诚相待！你懂嘞！！我不想懂！！！”',
            '“ 为什么？因为进不去啊！！！ ”',
            '“ 不要掐我啦！手有自己的想法！！！”',
            '“ 你真的是！硬是要我数数！！！”',
        ];
        let quoteIndex = 0;

        // ---------- 计时器 ----------
        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            const oneDay = 1000 * 60 * 60 * 24;

            if (diff < 0) {
                const daysToStart = Math.ceil(-diff / oneDay);
                document.getElementById('days').textContent = daysToStart;
                document.getElementById('dayLabel').textContent = '天后开始 ❤';
                document.getElementById('hours').textContent = '--';
                document.getElementById('minutes').textContent = '--';
                document.getElementById('seconds').textContent = '--';
                return;
            }

            const daysPassed = Math.floor(diff / oneDay);
            const daysUntil100 = 100 - daysPassed;

            let displayDays, labelText;

            if (daysUntil100 > 0) {
                displayDays = daysUntil100;
                labelText = '天后 就是100天 ✦';
            } else if (daysUntil100 === 0) {
                displayDays = 100;
                labelText = '天 ❤ 今天就是100天！';
            } else {
                displayDays = daysPassed;
                labelText = '天 ❤ 爱意不止';
                document.getElementById('titleText').innerHTML = '✦ 我们已经相爱 ✦';
            }

            document.getElementById('days').textContent = displayDays;
            document.getElementById('dayLabel').textContent = labelText;

            const msToday = diff % oneDay;
            const hours = Math.floor(msToday / (1000 * 60 * 60));
            const minutes = Math.floor((msToday % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((msToday % (1000 * 60)) / 1000);

            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            if (daysPassed >= 100 && !localStorage.getItem(CELEBRATION_KEY)) {
                celebrateHundredDay();
                localStorage.setItem(CELEBRATION_KEY, 'true');
            }
        }

        // ---------- 爱心雨 ----------
        function createHeartRain(count = 40) {
            const emojis = ['❤️', '💕', '💗', '🌸', '✨', '💖'];
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'heart-rain';
                    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    el.style.left = Math.random() * 100 + 'vw';
                    el.style.fontSize = (16 + Math.random() * 28) + 'px';
                    el.style.animationDuration = (2.5 + Math.random() * 3) + 's';
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 6000);
                }, i * 70);
            }
        }

        // ---------- 彩蛋：大标题 + 爱心雨 + 音乐 + 情书 ----------
        let wasGlobalPlaying = false;
        let celebrationMusicPlaying = false;

        function celebrateHundredDay() {
            const bgAudio = document.getElementById('bgMusic');
            wasGlobalPlaying = !bgAudio.paused;
            if (wasGlobalPlaying) {
                bgAudio.pause();
                document.getElementById('musicToggle').classList.remove('playing');
                document.getElementById('musicToggle').textContent = '🎵';
            }

            const celebAudio = document.getElementById('celebrationMusic');
            celebAudio.currentTime = 0;
            celebAudio.play().then(() => {
                celebrationMusicPlaying = true;
            }).catch(() => {});

            // 显示大标题
            const container = document.createElement('div');
            container.className = 'celebration';
            container.innerHTML = `<div class="celebration-text">🎉 100天快乐 🎉</div>`;
            document.body.appendChild(container);
            createHeartRain(80);

            // 4秒后标题淡出，然后显示情书
            setTimeout(() => {
                container.classList.add('fade-out');
                setTimeout(() => {
                    container.remove();
                    // 显示情书
                    showLetter();
                }, 1200);
            }, 4000);
        }

        // ---------- 显示情书 ----------
        function showLetter() {
            // 创建遮罩
            const overlay = document.createElement('div');
            overlay.className = 'letter-overlay';
            overlay.innerHTML = `
                <div class="letter-card">
                    <h2>💌 给你的情书</h2>
                    <div class="letter-content">${LOVE_LETTER.replace(/\n/g, '<br>')}</div>
                    <button class="letter-close" id="closeLetterBtn">💕 关闭情书</button>
                </div>
            `;
            document.body.appendChild(overlay);

            // 强制重排后添加 show 类实现动画
            requestAnimationFrame(() => {
                overlay.classList.add('show');
            });

            // 关闭按钮事件
            const closeBtn = overlay.querySelector('#closeLetterBtn');
            closeBtn.addEventListener('click', function() {
                closeLetter(overlay);
            });

            // 也可以点击遮罩空白处关闭（但为了防止误触，只允许点击按钮关闭）
            // 如果需要，可以加上，但为了体验，只让按钮关闭。
        }

        function closeLetter(overlay) {
            // 移除情书
            overlay.classList.remove('show');
            setTimeout(() => {
                overlay.remove();
            }, 400);

            // 停止彩蛋音乐
            const celebAudio = document.getElementById('celebrationMusic');
            celebAudio.pause();
            celebAudio.currentTime = 0;
            celebrationMusicPlaying = false;

            // 恢复全局背景音乐（如果之前是播放状态）
            if (wasGlobalPlaying) {
                const bgAudio = document.getElementById('bgMusic');
                bgAudio.play().then(() => {
                    document.getElementById('musicToggle').classList.add('playing');
                    document.getElementById('musicToggle').textContent = '🔊';
                }).catch(() => {});
            }
        }

        // ---------- 定时更新 ----------
        setInterval(updateTimer, 1000);
        updateTimer();

        // ---------- 语录轮换 ----------
        function rotateQuote() {
            const el = document.getElementById('quoteDisplay');
            el.style.opacity = '0';
            setTimeout(() => {
                quoteIndex = (quoteIndex + 1) % quotes.length;
                el.textContent = quotes[quoteIndex];
                el.style.opacity = '1';
            }, 300);
        }
        setInterval(rotateQuote, 8000);

        // ---------- 惊喜按钮 ----------
        const btn = document.getElementById('loveBtn');
        const surprise = document.getElementById('surprise');
        btn.addEventListener('click', function() {
            const isHidden = surprise.classList.contains('hidden');
            surprise.classList.toggle('hidden');
            surprise.classList.toggle('show');
            this.textContent = isHidden ? '🌸 再看一眼' : '💗 点击 接收心动';
            if (isHidden) {
                createHeartRain(40);
            }
        });

        // ---------- 双击普通爱心雨 ----------
        document.addEventListener('dblclick', function(e) {
            // 排除点击右下角调试区域（避免干扰）
            const rect = {
                left: window.innerWidth - 200,
                top: window.innerHeight - 200,
                right: window.innerWidth,
                bottom: window.innerHeight
            };
            if (e.clientX > rect.left && e.clientY > rect.top) return;

            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'heart-rain';
                    el.textContent = ['❤️', '💕', '💗', '🌸', '✨', '💖'][Math.floor(Math.random() * 6)];
                    el.style.left = (e.clientX + (Math.random() - 0.5) * 200) + 'px';
                    el.style.fontSize = (18 + Math.random() * 24) + 'px';
                    el.style.animationDuration = (2 + Math.random() * 2.5) + 's';
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 5000);
                }, i * 50);
            }
        });

        // ---------- 背景音乐控制 ----------
        const audio = document.getElementById('bgMusic');
        const musicToggle = document.getElementById('musicToggle');

        let autoPlayAttempted = false;
        function tryAutoPlay() {
            if (autoPlayAttempted) return;
            autoPlayAttempted = true;
            audio.play().then(() => {
                musicToggle.classList.add('playing');
                musicToggle.textContent = '🔊';
            }).catch(() => {});
        }
        document.addEventListener('click', tryAutoPlay, { once: true });

        musicToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            if (audio.paused) {
                audio.play().then(() => {
                    this.classList.add('playing');
                    this.textContent = '🔊';
                }).catch(() => {
                    alert('播放失败，请检查音乐链接是否有效。');
                });
            } else {
                audio.pause();
                this.classList.remove('playing');
                this.textContent = '🎵';
            }
        });

        // ---------- 调试：双击右下角强制触发彩蛋（包含情书） ----------
        document.addEventListener('dblclick', function(e) {
            const rect = {
                left: window.innerWidth - 200,
                top: window.innerHeight - 200,
                right: window.innerWidth,
                bottom: window.innerHeight
            };
            if (e.clientX > rect.left && e.clientY > rect.top) {
                const already = localStorage.getItem(CELEBRATION_KEY);
                if (already) {
                    alert('彩蛋已经触发过啦！\n如果想再次测试，在控制台输入：localStorage.removeItem("hundredDayCelebrated")');
                } else {
                    const now = new Date();
                    const diff = now - startDate;
                    const daysPassed = Math.floor(diff / (1000 * 60 * 60 * 24));
                    if (daysPassed >= 100) {
                        celebrateHundredDay();
                        localStorage.setItem(CELEBRATION_KEY, 'true');
                        alert('🎉 已强制触发彩蛋（含情书）！');
                    } else {
                        alert(`当前已过 ${daysPassed} 天，还未达到 100 天，无法触发彩蛋。`);
                    }
                }
            }
        });
    </script>
</body>
</html>
